# HollyWing Motor — lean local stack. Run from the repository root.
#
# Local development (build on this machine):
#   docker compose up -d --build --remove-orphans
#
# Production on another host (pull images published to GHCR):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
#
# Services: frontend, api, db, redis, worker-telegram, telegram-bot
# Redis DBs: /0 cache, /1 telegram-bot, /2 celery results, /3 celery broker

x-api-build: &api-build
  image: ${IMAGE_REGISTRY:-ghcr.io/kimheang-code-it/rental_moto}/api:${IMAGE_TAG:-local}
  pull_policy: ${PULL_POLICY:-build}
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental}
      POSTGRES_DB: ${POSTGRES_DB:-rental_moto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rental} -d ${POSTGRES_DB:-rental_moto}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api-build
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - appdata:/srv/data
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rental}:${POSTGRES_PASSWORD:-rental}@db:5432/${POSTGRES_DB:-rental_moto}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EXPORT_DIR: /srv/data/exports
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-0123456789abcdef}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      TELEGRAM_BOT_CLIENT_ID: ${TELEGRAM_BOT_CLIENT_ID:-rental-telegram-bot}
      TELEGRAM_BOT_CLIENT_SECRET: ${TELEGRAM_BOT_CLIENT_SECRET:-dev-only-telegram-secret-change-me-0123456789abcdef}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      CORS_ALLOW_PRIVATE_NETWORKS: ${CORS_ALLOW_PRIVATE_NETWORKS:-true}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 18
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/kimheang-code-it/rental_moto}/frontend:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-same-origin}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v2/auth/setup-status"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  worker-telegram:
    <<: *api-build
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -Q critical,telegram --concurrency=2 --loglevel=INFO
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "--timeout", "15"]
      interval: 30s
      timeout: 20s
      start_period: 40s
      retries: 5
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rental}:${POSTGRES_PASSWORD:-rental}@db:5432/${POSTGRES_DB:-rental_moto}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-bot:
    image: ${IMAGE_REGISTRY:-ghcr.io/kimheang-code-it/rental_moto}/telegram-bot:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ./backend
      dockerfile: Dockerfile.telegram
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      REDIS_URL: redis://redis:6379/1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-polling}
      TELEGRAM_BOT_CLIENT_ID: ${TELEGRAM_BOT_CLIENT_ID:-rental-telegram-bot}
      TELEGRAM_BOT_CLIENT_SECRET: ${TELEGRAM_BOT_CLIENT_SECRET:-dev-only-telegram-secret-change-me-0123456789abcdef}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  appdata:
